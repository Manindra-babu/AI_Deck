version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_radar_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/ai_radar.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - EMAIL_RECIPIENT=${EMAIL_RECIPIENT:-}
      - TIMEZONE=${TIMEZONE:-Asia/Kolkata}
      - NEWS_COLLECTION_INTERVAL_MINUTES=${NEWS_COLLECTION_INTERVAL_MINUTES:-15}
      - DAILY_REPORT_HOUR=${DAILY_REPORT_HOUR:-7}
      - DAILY_REPORT_MINUTE=${DAILY_REPORT_MINUTE:-0}
      - FRONTEND_URL=http://localhost
    volumes:
      - radar_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_radar_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  radar_data:
    name: ai_radar_storage
