services:
  # Backend FastAPI Web Service
  - type: web
    name: ai-radar-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_SSL
        value: "true"
      - key: EMAIL_RECIPIENT
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: NEWS_COLLECTION_INTERVAL_MINUTES
        value: "15"
      - key: DAILY_REPORT_HOUR
        value: "7"
      - key: DAILY_REPORT_MINUTE
        value: "0"

  # Frontend Static Site
  - type: web
    name: ai-radar-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
